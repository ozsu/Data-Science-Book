title: Principles and Foundations of Data Science
description: Companion site for the book by M. Tamer Özsu — errata, review questions, and slides.
author: M. Tamer Özsu

theme: jekyll-theme-minimal

logo: "images/cover.jpg"

# Social-card image for link previews. jekyll-seo-tag reads "image" from page
# front matter only, so apply it to every page via defaults.
defaults:
  - scope:
      path: ""
    values:
      image: /images/cover.jpg

exclude:
  - README.md
  - LICENSE
  - CONTRIBUTING.md
